name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # actionlint comes from a GitHub release on each run. Keep it between runs, so that
      # an outage of the release downloads does not fail this job.
      - uses: actions/cache@v6
        with:
          path: ~/.github-actionlint
          key: actionlint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: actionlint-${{ runner.os }}-
      - run: ./test.sh

  # The narration tools are Python scripts that uv runs, and they read and write movies with FFmpeg. Their
  # tests skip on a machine without the two, and the verify job has neither. So this job installs both and
  # runs those tests: without it, a change that breaks a tool or the build of a narrated film would pass.
  # The tests of the movie export need FFmpeg too, so they run here, on the FFmpeg that Ubuntu installs.
  narration:
    name: narration tools (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: tools/narration/*.py
      - name: Install FFmpeg, which the tools read and write movies with
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      # Build one shared Python audio environment instead of creating one per Vitest worker.
      - name: Prepare shared Python audio environment
        run: |
          uv venv --python 3.12 /tmp/vizmatic-audio-venv
          uv pip install --python /tmp/vizmatic-audio-venv/bin/python numpy scipy soundfile
      # pnpm install runs prepare (`pnpm build`) once, so no second build step is needed.
      - run: pnpm install --frozen-lockfile
      - name: Test the tools, the one command of a film, the film shell, and the movie export
        env:
          VIZMATIC_TEST_USE_EXISTING_BUILD: "1"
          VIZMATIC_TEST_AUDIO_PYTHON: /tmp/vizmatic-audio-venv/bin/python
          VIZMATIC_TEST_BARE_PYTHON: /tmp/vizmatic-audio-venv/bin/python
        run: >-
          pnpm exec vitest run
          tests/narrated-tools-checks.test.ts
          tests/narrated-tools-mix.test.ts
          tests/narrated-tools-effects.test.ts
          tests/narrated-tools-chimes.test.ts
          tests/narrated-tools-draft.test.ts
          tests/narrated-tools-resound.test.ts
          tests/narrated-tools-sync.test.ts
          tests/narrated-cli.test.ts
          tests/narrated.test.ts
          tests/narration-hold.test.ts
          tests/video.test.ts
          tests/video-encoder.test.ts
          tests/video-socket.test.ts
          tests/avc-splice.test.ts
          tests/media-excerpt.test.ts
          tests/canvas-readback.test.ts
          tests/cli-video.test.ts
          tests/cli-film.test.ts
          tests/cli-film-check.test.ts
          tests/stage-export.test.ts
          tests/stage-frame-reuse.test.ts
          tests/catalog-film-quality.test.ts
          tests/scene-renderer.test.ts
          tests/studio-mp4.test.ts

  playground:
    name: playground browser (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # The website is not committed, and it deploys only at a release. So each pull request
      # must prove here that a clean checkout builds it. The install runs `pnpm build`.
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:build
      # Each file that the two builds write must have a rule in .gitignore, and no committed
      # file may change. The status lists each file that breaks this.
      - name: Check that the build leaves a clean tree
        run: |
          git status --porcelain --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"
      - id: playwright-version
        name: Read installed Playwright version
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium and FFmpeg for browser and Studio checks
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
          sudo apt-get install -y --no-install-recommends ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: Run visual parity, Playground, scene-browser, and Studio browser suites
        env:
          VIZMATIC_BROWSER_TESTS: '1'
        run: |
          set -euo pipefail
          pnpm check:studio &
          pid_studio=$!
          pnpm check:playground &
          pid_playground=$!
          (
            pnpm check:scene-browser
            timeout --kill-after=10s 180s pnpm exec vitest run --maxWorkers 1 --reporter verbose \
              tests/stage-image.test.ts tests/stage-bloom-browser.test.ts tests/stage-engine-upgrades.test.ts \
              tests/stage-tex-browser.test.ts tests/stage-scalar-field-browser.test.ts tests/stage-color-bar-raster.test.ts \
              tests/fourier-seek-browser.test.ts tests/site-film-preview-browser.test.ts
          ) &
          pid_parity=$!
          status=0
          wait "$pid_studio" || status=1
          wait "$pid_playground" || status=1
          wait "$pid_parity" || status=1
          exit "$status"

  runtime:
    name: runtime (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # pnpm 11 requires Node 22. Install and build once, then exercise the package under each supported runtime.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --config.ignore-scripts=true pack --pack-destination /tmp/vizmatic-runtime-package
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: node scripts/check-runtime.mjs
      - run: node scripts/check-consumer.mjs /tmp/vizmatic-runtime-package/*.tgz
      # verify (Node 22) already runs the full Vitest suite on Node 22, and Vitest 5 requires Node 22.12+.
      # Run the full suite here on Node 24 so both Node 22 and Node 24 execute every test without duplicating Node 22.
      - if: matrix.node-version == 24
        run: node node_modules/vitest/vitest.mjs run
        env:
          VIZMATIC_TEST_USE_EXISTING_BUILD: "1"
