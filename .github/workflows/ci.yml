name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # actionlint comes from a GitHub release on each run. Keep it between runs, so that
      # an outage of the release downloads does not fail this job.
      - uses: actions/cache@v6
        with:
          path: ~/.github-actionlint
          key: actionlint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: actionlint-${{ runner.os }}-
      - run: ./test.sh

  playground:
    name: playground browser (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # The website is not committed, and it deploys only at a release. So each pull request
      # must prove here that a clean checkout builds it. The install runs `pnpm build`.
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:build
      # Each file that the two builds write must have a rule in .gitignore, and no committed
      # file may change. The status lists each file that breaks this.
      - name: Check that the build leaves a clean tree
        run: |
          git status --porcelain --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"
      - run: pnpm docs:check
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check image pixels in Chromium and Node
        run: pnpm exec vitest run tests/stage-image.test.ts
        env:
          VIZMATIC_BROWSER_TESTS: '1'
      - name: Install FFmpeg, which the Studio journey uses to decode its exports
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: pnpm check:playground
      - run: pnpm check:scene-browser
      - run: pnpm check:studio

  runtime:
    name: runtime (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # pnpm 11 requires Node 22. Install and build once, then exercise the package under each supported runtime.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --config.ignore-scripts=true pack --pack-destination /tmp/vizmatic-runtime-package
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: node scripts/check-runtime.mjs
      - run: node scripts/check-consumer.mjs /tmp/vizmatic-runtime-package/*.tgz
      # Vitest 5 requires Node 22.12+; Node 20 exercises the built package directly.
      - if: matrix.node-version != 20
        run: node node_modules/vitest/vitest.mjs run
        env:
          VIZMATIC_TEST_USE_EXISTING_BUILD: "1"
