name: Pages

# The public site shows the last release. A merge to main does not deploy.
# The Release workflow starts this workflow for the tag that it published. A person can also start
# it by hand, for example for a fix of the docs between two releases:
#   gh workflow run pages.yml -f ref=main
# Always start it on main, which is the default. The github-pages environment accepts a
# deployment from main only. The input selects the ref that the run builds.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build and deploy, such as v0.9.0 or main."
        required: true
      deploy:
        description: "Publish the site after validating the rendered catalog."
        type: boolean
        default: true

permissions:
  actions: read
  contents: read
  id-token: write
  pages: write

# One deploy at a time. A run that has started goes to its end, and the newest request runs after it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # Resolve a movable branch or tag once. Later jobs check out this exact SHA.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - id: commit
        name: Record the commit of that ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check catalog workflow compatibility before building
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          let source = ''
          try { source = readFileSync('scripts/render-films.ts', 'utf8') } catch {}
          if (!/^export const CATALOG_PROTOCOL = 'cpu-shards-v1'$/m.test(source)) {
            console.error('::error::The selected ref does not support the sharded CPU catalog workflow (--shard, --print-cache-key, --require-cache). Choose main or a release containing the catalog cache/sharding update. Older refs such as v0.8.3 cannot be deployed with this workflow.')
            process.exit(1)
          }
          NODE
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # prepare builds the package once; subsequent jobs use these exact outputs.
      - run: pnpm install --frozen-lockfile
      - uses: actions/upload-artifact@v7
        with:
          name: pages-package-${{ steps.commit.outputs.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  catalog:
    name: Catalog CPU shard ${{ matrix.shard }}/4
    needs: prepare
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v7
        with:
          name: pages-package-${{ needs.prepare.outputs.sha }}
          path: dist
      - name: Install CPU encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - id: cache-key
        name: Hash this shard's rendering inputs
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          key="$(pnpm exec tsx scripts/render-films.ts --shard "$SHARD/4" --print-cache-key | tail -n 1)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Cache this shard's rendered films
        uses: actions/cache@v6
        with:
          path: .cache/films
          key: pages-films-v2-${{ runner.os }}-4-${{ matrix.shard }}-${{ steps.cache-key.outputs.key }}
          restore-keys: |
            pages-films-v2-${{ runner.os }}-4-${{ matrix.shard }}-
      - name: Render this CPU shard
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm render:films --shard "$SHARD/4" --workers 4 --no-posters --cache-dir .cache/films
      # Upload this run's outputs, not stale files restored from an older shard plan.
      - name: Stage verified shard files
        run: |
          mkdir -p .cache/shard
          for film in docs/assets/films/*.mp4; do
            id="$(basename "$film" .mp4)"
            cp "$film" ".cache/films/$id.sha256" .cache/shard/
          done
      - uses: actions/upload-artifact@v7
        with:
          name: pages-films-${{ needs.prepare.outputs.sha }}-${{ matrix.shard }}
          path: .cache/shard/*
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  deploy:
    needs: [prepare, catalog]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v7
        with:
          name: pages-package-${{ needs.prepare.outputs.sha }}
          path: dist
      - name: Install CPU encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v7
        with:
          pattern: pages-films-${{ needs.prepare.outputs.sha }}-*
          path: .cache/films
          merge-multiple: true
      - name: Assemble and verify the complete film catalog
        run: pnpm render:films --no-posters --cache-dir .cache/films --require-cache
      - name: Build showcase media from source
        run: pnpm exec tsx scripts/render-video-example.ts
      # Use the package from prepare instead of rebuilding for each render command.
      - run: pnpm exec tsx scripts/render-examples.ts
      - run: pnpm site:build
      - run: pnpm docs:check --require-video
      # The rendered examples, the film posters, and some data files in docs/ are still committed.
      # This step fails when the build of this run changed one of them.
      - name: Ensure committed output is up to date
        run: git diff --exit-code -- docs examples/README.md
      - uses: actions/configure-pages@v6
        if: inputs.deploy
      - uses: actions/upload-pages-artifact@v5
        if: inputs.deploy
        with:
          path: docs
      - id: deployment
        name: Create Pages deployment
        if: inputs.deploy
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail

          artifact_id=""
          for _ in {1..30}; do
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages") | .id' | head -n 1)"
            if [ -n "$artifact_id" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$artifact_id" ]; then
            echo "github-pages artifact not found" >&2
            exit 1
          fi

          oidc_token="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')"

          if [ -z "$oidc_token" ] || [ "$oidc_token" = "null" ]; then
            echo "OIDC token not available" >&2
            exit 1
          fi

          payload="$(mktemp)"
          jq -n \
            --argjson artifact_id "$artifact_id" \
            --arg pages_build_version "$PAGES_SHA" \
            --arg oidc_token "$oidc_token" \
            '{
              artifact_id: $artifact_id,
              pages_build_version: $pages_build_version,
              oidc_token: $oidc_token
            }' > "$payload"

          response="$(gh api --method POST "repos/$GITHUB_REPOSITORY/pages/deployments" --input "$payload")"
          page_url="$(printf '%s' "$response" | jq -r '.page_url // empty')"
          deployment_id="$(printf '%s' "$response" | jq -r '.id // empty')"

          if [ -z "$deployment_id" ]; then
            echo "Pages deployment ID missing from response" >&2
            exit 1
          fi

          echo "page_url=${page_url:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/}" >> "$GITHUB_OUTPUT"
          echo "Created Pages deployment $deployment_id; waiting for publication."

          status=""
          for _ in {1..60}; do
            status="$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$deployment_id" --jq '.status' 2>/dev/null || true)"
            case "$status" in
              succeed)
                echo "Pages deployment $deployment_id succeeded."
                exit 0
                ;;
              error|failed|cancelled|canceled)
                echo "Pages deployment $deployment_id failed with status: $status" >&2
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Pages deployment $deployment_id did not complete; last status: ${status:-unavailable}" >&2
          exit 1
