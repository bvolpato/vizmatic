name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver bump or exact version, for example patch, minor, major, or 0.2.0"
        required: true
        default: patch
      publish_only:
        description: "Publish an existing release tag"
        required: false
        type: boolean
        default: false
      tag:
        description: "Existing v-prefixed tag used by publish-only dispatches"
        required: false
        default: ""

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && !inputs.publish_only
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF_NAME" = "main"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Refresh release branch
        run: git pull --ff-only origin "${{ github.ref_name }}"
      - run: pnpm install --frozen-lockfile
      - name: Validate npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami
      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Version package
        run: |
          npm version "${{ inputs.version }}" --no-git-tag-version
          pnpm sync:plugin-versions
          pnpm docs:check
          VERSION="$(node -p "require('./package.json').version")"
          git add package.json plugins/vizmatic/.codex-plugin/plugin.json plugins/vizmatic/.claude-plugin/plugin.json .claude-plugin/marketplace.json
          git commit -m "Release v${VERSION}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
      - run: pnpm verify
      - name: Ensure generated files are committed
        run: test -z "$(git status --porcelain)"
      - name: Ensure tested branch did not advance
        run: |
          TESTED_SHA="$(git rev-parse HEAD^)"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/${{ github.ref_name }}" | cut -f1)"
          if [ "$TESTED_SHA" != "$REMOTE_SHA" ]; then
            echo "Release branch advanced after verification: tested ${TESTED_SHA}, remote ${REMOTE_SHA}" >&2
            exit 1
          fi
      - name: Push release commit and tag atomically
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          git push --atomic origin "HEAD:${{ github.ref_name }}" "refs/tags/v${VERSION}"
      - name: Dispatch verified tag publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh workflow run release.yml --ref "v${VERSION}" -f publish_only=true -f tag="v${VERSION}" -f version="${VERSION}"

  publish:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG}" = "v${VERSION}"
      - run: pnpm verify
      - name: Ensure generated files are committed
        run: test -z "$(git status --porcelain)"
      - name: Validate npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${VERSION} is already published."
          else
            npm publish --ignore-scripts --access public --provenance
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          CURRENT_TAG="v${VERSION}"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)"

          {
            echo "## Changes since latest version"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "- Previous version: \`${PREVIOUS_TAG}\`"
              echo "- Current version: \`${CURRENT_TAG}\`"
              echo "- Diff: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${CURRENT_TAG}"
              echo
              echo "### Commits"
              echo
              if git log --format='%H' "${PREVIOUS_TAG}..${CURRENT_TAG}^" | grep -q .; then
                git log --reverse --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..${CURRENT_TAG}^"
                echo
              else
                echo "- No product commits since ${PREVIOUS_TAG}; release metadata only."
              fi
            else
              echo "- Current version: \`${CURRENT_TAG}\`"
              echo "- Diff: initial release"
              echo
              echo "### Commits"
              echo
              git log --reverse --pretty=format:"- %s (%h)"
              echo
            fi
            echo
          } > release-notes.md

          cat release-notes.md

          if gh release view "$CURRENT_TAG" >/dev/null 2>&1; then
            echo "GitHub release ${CURRENT_TAG} already exists."
            exit 0
          fi

          if [ -n "$PREVIOUS_TAG" ]; then
            gh release create "$CURRENT_TAG" --generate-notes --notes-start-tag "$PREVIOUS_TAG" --notes-file release-notes.md --verify-tag
          else
            gh release create "$CURRENT_TAG" --generate-notes --notes-file release-notes.md --verify-tag
          fi
