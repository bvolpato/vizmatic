name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v-prefixed tag to verify and publish"
        required: true
        default: ""

permissions:
  # The last step starts the Pages workflow.
  actions: write
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG}" = "v${VERSION}"
      - uses: actions/cache@v6
        with:
          path: ~/.github-actionlint
          key: actionlint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: actionlint-${{ runner.os }}-
      - run: pnpm verify
      # The website is built here but not committed: .gitignore names each of its files. This step
      # fails when committed output changed, or when the build wrote a file with no rule.
      - name: Ensure the build leaves a clean tree
        run: test -z "$(git status --porcelain)"
      - name: Validate npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${VERSION} is already published."
          else
            npm publish --ignore-scripts --access public --provenance
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          CURRENT_TAG="v${VERSION}"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)"

          {
            echo "## Changes since latest version"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "- Previous version: \`${PREVIOUS_TAG}\`"
              echo "- Current version: \`${CURRENT_TAG}\`"
              echo "- Diff: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${CURRENT_TAG}"
              echo
              echo "### Commits"
              echo
              git log --reverse --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..${CURRENT_TAG}"
              echo
            else
              echo "- Current version: \`${CURRENT_TAG}\`"
              echo "- Diff: initial release"
              echo
              echo "### Commits"
              echo
              git log --reverse --pretty=format:"- %s (%h)"
              echo
            fi
            echo
          } > release-notes.md

          cat release-notes.md

          if gh release view "$CURRENT_TAG" >/dev/null 2>&1; then
            echo "GitHub release ${CURRENT_TAG} already exists."
            exit 0
          fi

          if [ -n "$PREVIOUS_TAG" ]; then
            gh release create "$CURRENT_TAG" --generate-notes --notes-start-tag "$PREVIOUS_TAG" --notes-file release-notes.md --verify-tag
          else
            gh release create "$CURRENT_TAG" --generate-notes --notes-file release-notes.md --verify-tag
          fi
      # The public site shows the last release. This step comes last, so a failed publish starts
      # no deploy, and the site never describes a version that nobody can install.
      # The Pages workflow builds the site from this tag. It runs on main, because the
      # github-pages environment accepts a deployment from main only.
      - name: Start the deploy of the site for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$RELEASE_TAG"
          echo "Started the Pages workflow for $RELEASE_TAG. See https://github.com/$GITHUB_REPOSITORY/actions/workflows/pages.yml"
