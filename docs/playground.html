  <script>
    const themeColorMeta = document.querySelector('meta[name="theme-color"]')
    const themeButtons = document.querySelectorAll('[data-theme-choice]')
    const systemThemeQuery = window.matchMedia('(prefers-color-scheme: light)')
    const playground = document.getElementById('playground')

    function getSavedTheme() {
      try { return localStorage.getItem('vizmatic-theme') } catch { return undefined }
    }

    function normalizeThemeChoice(theme) {
      return theme === 'light' || theme === 'dark' ? theme : 'system'
    }

    function resolveTheme(theme) {
      return theme === 'system' ? (systemThemeQuery.matches ? 'light' : 'dark') : theme
    }

    function setSiteTheme(theme) {
      const choice = normalizeThemeChoice(theme)
      const resolved = resolveTheme(choice)
      document.documentElement.dataset.siteTheme = resolved
      document.documentElement.dataset.themeMode = choice
      try { localStorage.setItem('vizmatic-theme', choice) } catch {}
      themeColorMeta?.setAttribute('content', resolved === 'light' ? '#f4f5f2' : '#080a0f')
      themeButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.themeChoice === choice)))
      const changed = playground?.dataset.vizmaticPlaygroundTheme !== resolved
      if (playground) playground.dataset.vizmaticPlaygroundTheme = resolved
      if (changed) playground?.dispatchEvent(new CustomEvent('vizmatic-playground-theme', { detail: { theme: resolved } }))
    }

    setSiteTheme(normalizeThemeChoice(getSavedTheme()))
    themeButtons.forEach((button) => button.addEventListener('click', () => setSiteTheme(button.dataset.themeChoice)))
    systemThemeQuery.addEventListener('change', () => {
      if (document.documentElement.dataset.themeMode === 'system') setSiteTheme('system')
    })
  </script>
  <script type="module" src="playground.js"></script>
